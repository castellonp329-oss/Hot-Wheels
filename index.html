<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz Día de los Carritos de Hot Wheels 💙</title>
  <style>
    /* Estilos Generales */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0c10;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    /* Fondo Estrellado / Destellos */
    .stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 1%, transparent 1%) 0 0/20px 20px;
      z-index: 1;
    }

    /* Encabezado */
    header {
      margin-top: 30px;
      text-align: center;
      z-index: 10;
    }

    h1 {
      font-size: 2rem;
      color: #4da6ff;
      text-shadow: 0 0 10px rgba(77, 166, 255, 0.8);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Carrito Flotante pasando de lado a lado */
    .hotwheel-car {
      position: absolute;
      top: 25%;
      left: -100px;
      width: 80px;
      z-index: 5;
      animation: drive 6s linear infinite;
    }

    @keyframes drive {
      0% { left: -100px; transform: scaleX(1); }
      50% { left: 100vw; transform: scaleX(1); }
      50.1% { left: 100vw; transform: scaleX(-1); }
      100% { left: -100px; transform: scaleX(-1); }
    }

    /* Flores saliendo desde abajo */
    .flowers-container {
      position: absolute;
      bottom: -300px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 15px;
      z-index: 10;
      cursor: pointer;
      animation: growUp 2.5s cubic-bezier(0.175, 0.885, 0.32, 1.27) forwards;
      animation-delay: 0.5s;
    }

    @keyframes growUp {
      to {
        bottom: 50px;
      }
    }

    /* Diseño de Flor Azul Vectorial */
    .flower {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s ease;
    }

    .flower:hover {
      transform: scale(1.1);
    }

    .petals {
      width: 70px;
      height: 70px;
      background: #1e90ff;
      border-radius: 50%;
      box-shadow: 0 0 20px #00bfff, inset 0 0 15px #00008b;
      position: relative;
    }

    .petals::before, .petals::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: inherit;
      border-radius: inherit;
      box-shadow: inherit;
    }

    .petals::before { transform: rotate(30deg); }
    .petals::after { transform: rotate(60deg); }

    .stem {
      width: 8px;
      height: 180px;
      background: linear-gradient(to bottom, #2e8b57, #006400);
      border-radius: 4px;
    }

    /* Modal / Tarjeta Emergente */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .card {
      background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
      border-radius: 20px;
      padding: 25px;
      max-width: 320px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 191, 255, 0.5);
      position: relative;
      transform: translateY(30px);
      transition: transform 0.4s ease;
    }

    .modal-overlay.active .card {
      transform: translateY(0);
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: rgba(255, 255, 255, 0.3);
      border: none;
      color: white;
      font-size: 1.2rem;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      cursor: pointer;
    }

    .card h2 {
      font-size: 1.4rem;
      margin-bottom: 15px;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .gift-card-img {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      margin-top: 10px;
    }

    .click-hint {
      position: absolute;
      bottom: 20px;
      font-size: 0.9rem;
      color: #87cefa;
      z-index: 15;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>

  <div class="stars"></div>

  <header>
    <h1>Feliz día de los carritos<br>de Hot Wheels 💙🚗</h1>
  </header>

  <!-- Elemento de Carrito animado -->
  <img class="hotwheel-car" src="https://cdn-icons-png.flaticon.com/512/744/741407.png" alt="Hot Wheels Car">

  <!-- Ramo de Flores Azules que aparecen desde abajo -->
  <div class="flowers-container" id="flowersContainer">
    <div class="flower">
      <div class="petals"></div>
      <div class="stem"></div>
    </div>
    <div class="flower" style="transform: scale(1.15) translateY(-10px);">
      <div class="petals"></div>
      <div class="stem"></div>
    </div>
    <div class="flower">
      <div class="petals"></div>
      <div class="stem"></div>
    </div>
  </div>

  <div class="click-hint">Toca las flores para ver tu sorpresa ✨</div>

  <!-- Ventana Modal de la Tarjeta -->
  <div class="modal-overlay" id="modal">
    <div class="card">
      <button class="close-btn" id="closeBtn">&times;</button>
      <h2>Cuanto más tiempo estoy contigo, más te amo. ❤️</h2>
      
      <!-- Puedes reemplazar la URL de la imagen por tu propia tarjeta de regalo o Hot Wheels -->
      <img class="gift-card-img" src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/00/PlayStation_logo.svg/1200px-PlayStation_logo.svg.png" alt="Tarjeta de Regalo">
    </div>
  </div>

  <script>
    const flowers = document.getElementById('flowersContainer');
    const modal = document.getElementById('modal');
    const closeBtn = document.getElementById('closeBtn');

    // Al presionar las flores abre la tarjeta
    flowers.addEventListener('click', () => {
      modal.classList.add('active');
    });

    // Cerrar la tarjeta al presionar la 'X'
    closeBtn.addEventListener('click', () => {
      modal.classList.remove('active');
    });

    // Cerrar al hacer clic fuera de la tarjeta
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('active');
      }
    });
  </script>
</body>
  </html>
